services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://26.153.167.228:55555/api/
    container_name: dormly_frontend_app
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://26.153.167.228:55555/api/
      - PORT=3000
    expose:
      - "3000"
    networks:
      - dormly_net

  nginx:
    image: nginx:alpine
    container_name: dormly_frontend_nginx
    restart: always
    ports:
      - "5556:443"
      - "5555:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./ssl:/etc/nginx/ssl
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - app
    networks:
      - dormly_net

networks:
  dormly_net:
    driver: bridge
