services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://26.153.167.228:55555/api/
    container_name: dormly_frontend_app
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://26.153.167.228:55555/api/
      - PORT=3000
    expose:
      - "3000"
    networks:
      - dormly_net

  nginx:
    image: nginx:alpine
    container_name: dormly_frontend_nginx
    restart: always
    ports:
      - "5556:443"
      - "5555:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache openssl > /dev/null 2>&1 &&
      if [ ! -f /etc/nginx/ssl/cert.pem ] || [ ! -f /etc/nginx/ssl/key.pem ]; then
        echo '==> Generating self-signed SSL certificate for HTTPS...';
        mkdir -p /etc/nginx/ssl;
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /etc/nginx/ssl/key.pem \
          -out /etc/nginx/ssl/cert.pem \
          -subj '/C=VN/ST=HCM/L=HCM/O=Dormly/CN=localhost' \
          -addext 'subjectAltName=DNS:localhost,IP:26.153.167.228,IP:127.0.0.1';
        echo '==> SSL Certificate created successfully.';
      fi;
      exec nginx -g 'daemon off;'
      "
    depends_on:
      - app
    networks:
      - dormly_net

networks:
  dormly_net:
    driver: bridge
